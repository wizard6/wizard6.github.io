<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wizard6 · book</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1000px 520px at 50% 30%, #1c2436 0%, transparent 55%),
        #090b10;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: #eceae6;
      overflow: hidden;
    }

    .stage {
      perspective: 1100px;
      perspective-origin: 50% 45%;
    }

    .book {
      --rx: 0deg;
      --ry: -28deg;
      --tz: 0px;
      width: 200px;
      height: 300px;
      position: relative;
      transform-style: preserve-3d;
      transform:
        translateZ(var(--tz))
        rotateY(var(--ry))
        rotateX(var(--rx));
      transition: transform 0.14s ease-out;
      cursor: grab;
    }

    .face {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    /* Front cover */
    .cover-front {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.12), transparent 42%),
        linear-gradient(180deg, #1f2937 0%, #111827 100%);
      border-radius: 2px 5px 5px 2px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 10px 0 18px rgba(0,0,0,0.25);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
    }

    .cover-front h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: 0.18em;
      font-weight: 600;
    }

    .cover-front p {
      margin: 0.85rem 0 0;
      font-size: 0.78rem;
      opacity: 0.65;
      letter-spacing: 0.12em;
      font-family: system-ui, sans-serif;
    }

    .cover-ornament {
      width: 42px;
      height: 2px;
      margin: 1rem auto 0;
      background: linear-gradient(90deg, transparent, #f87171, #60a5fa, transparent);
      opacity: 0.9;
    }

    /* Back cover */
    .cover-back {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-radius: 5px 2px 2px 5px;
      transform: rotateY(180deg) translateZ(28px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    /* Pages block between covers */
    .pages {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 3px;
      right: 3px;
      background: repeating-linear-gradient(
        to right,
        #f8fafc 0 1px,
        #e2e8f0 1px 2px
      );
      transform: translateZ(14px);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.08);
    }

    /* Spine — barber pole */
    .spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 28px;
      transform-origin: left center;
      transform: rotateY(-90deg) translateX(-14px);
      overflow: hidden;
      border-radius: 3px;
      background: #0a0a0a;
      box-shadow:
        inset -4px 0 10px rgba(0,0,0,0.4),
        inset 3px 0 6px rgba(255,255,255,0.1);
    }

    .spine::before {
      content: "";
      position: absolute;
      left: -50%;
      top: -70%;
      width: 200%;
      height: 240%;
      background: repeating-linear-gradient(
        -32deg,
        #e11d48 0 16px,
        #f8fafc 16px 30px,
        #2563eb 30px 46px,
        #f8fafc 46px 60px
      );
      animation: pole 7.5s linear infinite;
      animation-play-state: paused;
    }

    .book:hover .spine::before,
    .book.is-hover .spine::before {
      animation-play-state: running;
    }

    @keyframes pole {
      to { transform: translateY(60px); }
    }

    .spine-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      writing-mode: vertical-rl;
      letter-spacing: 0.28em;
      font-size: 0.72rem;
      font-weight: 700;
      color: #0b0d12;
      text-shadow: 0 1px 0 rgba(255,255,255,0.35);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* right page edge */
    .fore-edge {
      position: absolute;
      top: 5px;
      bottom: 5px;
      right: 0;
      width: 14px;
      transform-origin: right center;
      transform: rotateY(90deg) translateX(7px);
      background: repeating-linear-gradient(
        to bottom,
        #f1f5f9 0 2px,
        #cbd5e1 2px 3px
      );
      box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
    }

    .caption {
      margin-top: 2.75rem;
      text-align: center;
      font-size: 0.82rem;
      opacity: 0.5;
      letter-spacing: 0.04em;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div>
    <div class="stage">
      <div class="book" id="book" aria-label="三维书">
        <div class="pages" aria-hidden="true"></div>
        <div class="face cover-front">
          <div>
            <h1>WIZARD</h1>
            <div class="cover-ornament" aria-hidden="true"></div>
            <p>A SMALL VOLUME</p>
          </div>
        </div>
        <div class="face cover-back" aria-hidden="true"></div>
        <div class="spine"><span class="spine-label">WIZARD</span></div>
        <div class="fore-edge" aria-hidden="true"></div>
      </div>
    </div>
    <p class="caption">完整书体 · 书脊彩纹 · 悬停按位置倾斜</p>
  </div>

  <script>
    const book = document.getElementById("book");
    const baseY = -28;
    const max = 16;

    function tilt(x, y) {
      const r = book.getBoundingClientRect();
      const px = Math.min(1, Math.max(0, (x - r.left) / r.width));
      const py = Math.min(1, Math.max(0, (y - r.top) / r.height));
      const ry = baseY + (px - 0.5) * 2 * max;
      const rx = (0.5 - py) * 2 * (max * 0.7);
      book.style.setProperty("--ry", ry.toFixed(2) + "deg");
      book.style.setProperty("--rx", rx.toFixed(2) + "deg");
      book.style.setProperty("--tz", "18px");
    }

    function reset() {
      book.style.setProperty("--ry", baseY + "deg");
      book.style.setProperty("--rx", "0deg");
      book.style.setProperty("--tz", "0px");
      book.classList.remove("is-hover");
    }

    book.addEventListener("pointerenter", () => book.classList.add("is-hover"));
    book.addEventListener("pointermove", (e) => tilt(e.clientX, e.clientY));
    book.addEventListener("pointerleave", reset);
  </script>
</body>
</html>
