<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="wizard6 · 云端工作台" />
  <title>云端工作台 · wizard6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@500;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />
  <style>
    :root {
      --radius: 16px;
      --font-serif: "Noto Serif SC", "Songti SC", serif;
      --font-sans: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-epitaph: "Great Vibes", "Zhi Mang Xing", "Noto Serif SC", cursive;
      --bg: #080a0f;
      --card: rgba(20, 26, 38, 0.72);
      --card-hover: rgba(26, 34, 51, 0.9);
      --text: #eef2ff;
      --text-soft: #c8d2e8;
      --muted: #7b8ba8;
      --accent: #6d8bff;
      --accent-2: #a78bfa;
      --line: #243044;
      --ok: #34d399;
      --shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; scrollbar-width: none !important; -ms-overflow-style: none !important; }
    *::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text); font-family: var(--font-sans);
    }
    .nebula {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(900px 520px at 12% 8%, rgba(109,139,255,.22), transparent 55%),
        radial-gradient(700px 480px at 88% 18%, rgba(167,139,250,.18), transparent 50%),
        radial-gradient(600px 420px at 70% 90%, rgba(56,189,248,.07), transparent 55%),
        var(--bg);
    }
    .shell { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; }

    .site-header {
      flex: 0 0 auto;
      backdrop-filter: blur(18px);
      background: rgba(8,10,15,.72);
      border-bottom: 1px solid var(--line);
    }
    .site-header::after {
      content: ""; display: block; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,178,250,.35), transparent);
    }
    .header-inner {
      max-width: 1120px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand {
      color: var(--text); text-decoration: none;
      font-family: var(--font-serif); font-weight: 700; letter-spacing: .06em;
    }
    .brand span { color: var(--accent-2); font-weight: 500; margin-left: .45rem; font-size: .82rem; letter-spacing: .12em; }
    .header-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .82rem; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(109,139,255,.22);
      background: rgba(109,139,255,.1); color: #b8c8ff;
    }
    .dot {
      position: relative; width: 8px; height: 8px; border-radius: 50%;
      background: var(--ok); box-shadow: 0 0 10px rgba(52,211,153,.75); flex-shrink: 0;
    }
    .dot::before, .dot::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid rgba(52,211,153,.85);
      transform: translate(-50%,-50%) scale(1); opacity: .9; pointer-events: none;
    }
    .dot::before { animation: breath-ring 2.2s ease-out infinite; }
    .dot::after { animation: breath-ring 2.2s ease-out infinite 1.1s; }
    @keyframes breath-ring {
      0% { transform: translate(-50%,-50%) scale(1); opacity: .85; }
      70%, 100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
    }

    .container {
      max-width: 1120px; margin: 0 auto; padding: 18px 20px 0;
      width: 100%; flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .hero {
      flex: 0 0 auto; position: relative; overflow: hidden;
      padding: 20px 22px 16px; margin-bottom: 12px;
      border-radius: calc(var(--radius) + 2px); border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(109,139,255,.08), rgba(167,139,250,.05)), var(--card);
      box-shadow: var(--shadow);
    }
    .hero::before {
      content: ""; position: absolute; top: -40%; right: -8%; width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(109,139,255,.18), transparent 70%); pointer-events: none;
    }
    .hero-eyebrow { position: relative; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2); margin-bottom: 6px; }
    .hero h1 { position: relative; margin: 0 0 6px; font-family: var(--font-serif); font-size: clamp(1.5rem, 3vw, 2rem); }
    .hero-desc { position: relative; margin: 0; font-family: var(--font-epitaph); font-size: clamp(1.15rem, 2.4vw, 1.5rem); color: var(--text-soft); letter-spacing: .06em; }

    .board-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
    .board {
      flex: 1; min-width: 0; min-height: 0; overflow: auto;
      overscroll-behavior: contain; padding: 2px 8px 20px 0;
    }
    .sb-rail {
      position: absolute; top: 0; right: 0; bottom: 0; width: 14px; z-index: 5;
      pointer-events: none; opacity: 0; transition: opacity .2s ease;
    }
    .sb-rail.is-visible { opacity: 1; pointer-events: auto; }
    .sb-rail::before {
      content: ""; position: absolute; inset: 0 3px; border-radius: 999px;
      background: rgba(255,255,255,.04); border: 1px solid rgba(109,139,255,.12);
    }
    .sb-thumb {
      position: absolute; left: 4px; width: 6px; min-height: 40px; border-radius: 999px;
      background: linear-gradient(180deg, rgba(140,168,255,.7), rgba(167,139,250,.55));
      box-shadow: 0 0 18px rgba(109,139,255,.35); cursor: grab; touch-action: none;
    }
    .sb-thumb.is-dragging, .sb-thumb:hover {
      width: 8px; left: 3px;
      background: linear-gradient(180deg, rgba(170,192,255,.95), rgba(196,168,255,.8));
      cursor: grabbing;
    }

    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; }
    .card {
      grid-column: span 6;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--card); backdrop-filter: blur(10px);
      padding: 16px 16px 14px; box-shadow: var(--shadow);
      min-height: 220px; display: flex; flex-direction: column;
    }
    .card.full { grid-column: span 12; min-height: 0; }
    .card h2 {
      margin: 0 0 10px; font-size: 1rem; font-family: var(--font-serif);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .card h2 .n {
      font-family: var(--font-sans); font-size: .72rem; font-weight: 600;
      color: #b8c8ff; border: 1px solid rgba(109,139,255,.25);
      background: rgba(109,139,255,.1); border-radius: 999px; padding: 2px 8px;
    }
    .muted { color: var(--muted); font-size: .85rem; line-height: 1.5; }

    .todo-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    .todo-item {
      display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: start;
      padding: 10px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,.04);
      background: rgba(255,255,255,.02);
    }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
    .todo-item input { margin-top: 3px; accent-color: var(--accent); }
    .todo-text { font-size: .9rem; line-height: 1.4; }
    .tag {
      font-size: .7rem; color: #9ee6c4; border: 1px solid rgba(72,199,142,.28);
      background: rgba(72,199,142,.12); border-radius: 999px; padding: 2px 7px; white-space: nowrap;
    }

    .status-grid { display: grid; gap: 10px; }
    .status-row {
      display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: start;
      padding: 10px; border-radius: 12px; background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.04);
    }
    .status-row .k { color: var(--muted); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 2px; }
    .status-row .v { font-size: .92rem; color: var(--text-soft); line-height: 1.45; }

    .tpl-list, .nav-list, .soft-list { display: grid; gap: 8px; }
    .tpl-item, .nav-item, .soft-item {
      display: block; text-decoration: none; color: inherit;
      padding: 10px 12px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.04); background: rgba(255,255,255,.02);
      transition: border-color .2s, background .2s, transform .2s;
    }
    a.tpl-item:hover, a.nav-item:hover, a.soft-item:hover {
      border-color: rgba(140,168,255,.4); background: var(--card-hover); transform: translateY(-1px);
    }
    .tpl-item strong, .nav-item strong, .soft-item strong { display: block; font-size: .92rem; margin-bottom: 3px; }
    .meta { color: var(--muted); font-size: .78rem; }

    .nav-groups { display: grid; gap: 12px; }
    .nav-group-title { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-2); margin: 0 0 6px; }

    .soft-item {
      display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
    }
    .soft-item .left strong { margin-bottom: 2px; }
    .kind {
      font-size: .7rem; border-radius: 999px; padding: 3px 8px;
      border: 1px solid rgba(167,139,250,.28); background: rgba(167,139,250,.12); color: #d4c4ff;
    }

    .site-footer {
      flex: 0 0 auto; border-top: 1px solid var(--line); background: rgba(8,10,15,.55);
    }
    .footer-inner {
      max-width: 1120px; margin: 0 auto; padding: 12px 20px;
      display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      color: var(--muted); font-size: .8rem;
    }
    .footer-inner a { color: var(--accent); text-decoration: none; }

    .empty { color: var(--muted); font-size: .88rem; padding: 8px 0; }

    @media (max-width: 860px) {
      .card { grid-column: span 12; }
    }
  </style>
</head>
<body>
  <div class="nebula" aria-hidden="true"></div>
  <div class="shell">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./">wizard6<span>CLOUD WORKBENCH</span></a>
        <div class="header-meta">
          <span class="pill"><i class="dot" aria-hidden="true"></i> <span id="online-label">云端在线</span></span>
          <span id="clock">--:--</span>
        </div>
      </div>
    </header>

    <div class="container">
      <section class="hero">
        <div class="hero-eyebrow">Workbench</div>
        <h1 id="hero-title">云端工作台</h1>
        <p class="hero-desc" id="hero-sub">待办 · 状态 · 模板 · 导航 · 账号</p>
      </section>

      <div class="board-wrap">
        <div class="board" id="board">
          <div class="grid">
            <section class="card" id="card-todos">
              <h2>待办事项 <span class="n">TODO</span></h2>
              <ul class="todo-list" id="todo-list"></ul>
            </section>

            <section class="card" id="card-status">
              <h2>当前状态 <span class="n">STATUS</span></h2>
              <div class="status-grid" id="status-grid"></div>
            </section>

            <section class="card" id="card-templates">
              <h2>模板 <span class="n">TEMPLATES</span></h2>
              <div class="tpl-list" id="tpl-list"></div>
            </section>

            <section class="card" id="card-nav">
              <h2>导航 <span class="n">NAV</span></h2>
              <div class="nav-groups" id="nav-groups"></div>
            </section>

            <section class="card full" id="card-software">
              <h2>使用的软件和账号一览 <span class="n">STACK</span></h2>
              <div class="soft-list" id="soft-list"></div>
            </section>
          </div>
        </div>
        <div class="sb-rail" id="sb-rail" aria-hidden="true">
          <div class="sb-thumb" id="sb-thumb" role="scrollbar" aria-controls="board" aria-orientation="vertical"></div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>wizard6 · 云端工作台</span>
        <a href="https://github.com/wizard6/wizard6.github.io/blob/master/config/workbench.json">编辑配置</a>
      </div>
    </footer>
  </div>

  <script>
    const TODO_KEY = "wizard6_workbench_todos_v1";

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    async function loadConfig() {
      const res = await fetch("./config/workbench.json?v=" + Date.now());
      if (!res.ok) throw new Error("config load failed");
      return res.json();
    }

    function mergeTodos(configTodos) {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(TODO_KEY) || "null"); } catch (_) {}
      if (!saved || !Array.isArray(saved)) return configTodos.map((t) => ({ ...t }));
      const map = Object.fromEntries(saved.map((t) => [t.id, t.done]));
      return configTodos.map((t) => ({ ...t, done: map[t.id] ?? t.done }));
    }

    function saveTodos(todos) {
      localStorage.setItem(TODO_KEY, JSON.stringify(todos.map(({ id, done }) => ({ id, done }))));
    }

    function renderTodos(todos) {
      const root = document.getElementById("todo-list");
      if (!todos.length) {
        root.innerHTML = '<p class="empty">暂无待办。可在 config/workbench.json 添加。</p>';
        return;
      }
      root.innerHTML = todos.map((t) => `
        <li class="todo-item ${t.done ? "done" : ""}" data-id="${esc(t.id)}">
          <input type="checkbox" ${t.done ? "checked" : ""} aria-label="完成" />
          <div class="todo-text">${esc(t.text)}</div>
          <span class="tag">${esc(t.tag || "一般")}</span>
        </li>
      `).join("");
      root.querySelectorAll(".todo-item input").forEach((input) => {
        input.addEventListener("change", () => {
          const id = input.closest(".todo-item").dataset.id;
          const item = todos.find((x) => x.id === id);
          if (!item) return;
          item.done = input.checked;
          saveTodos(todos);
          renderTodos(todos);
        });
      });
    }

    function renderStatus(status, daypart) {
      const rows = [
        ["在线", status.online ? status.label || "云端在线" : "离线"],
        ["焦点", status.focus || "—"],
        ["状态", status.mood || "—"],
        ["时段", daypart],
        ["备注", status.note || "—"],
      ];
      document.getElementById("status-grid").innerHTML = rows.map(([k, v]) => `
        <div class="status-row"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>
      `).join("");
      if (status.label) document.getElementById("online-label").textContent = status.label;
    }

    function renderTemplates(list) {
      const root = document.getElementById("tpl-list");
      if (!list?.length) {
        root.innerHTML = '<p class="empty">暂无模板。</p>';
        return;
      }
      root.innerHTML = list.map((t) => {
        const inner = `<strong>${esc(t.name)}</strong><div class="meta">${esc(t.desc || "")} · ${esc(t.tag || "")}</div>`;
        return t.url
          ? `<a class="tpl-item" href="${esc(t.url)}" target="_blank" rel="noreferrer">${inner}</a>`
          : `<div class="tpl-item">${inner}</div>`;
      }).join("");
    }

    function renderNav(list) {
      const root = document.getElementById("nav-groups");
      if (!list?.length) {
        root.innerHTML = '<p class="empty">暂无导航。</p>';
        return;
      }
      const groups = {};
      list.forEach((n) => {
        const g = n.group || "其他";
        (groups[g] ||= []).push(n);
      });
      root.innerHTML = Object.entries(groups).map(([g, items]) => `
        <div>
          <p class="nav-group-title">${esc(g)}</p>
          <div class="nav-list">
            ${items.map((n) => `
              <a class="nav-item" href="${esc(n.url)}" target="_blank" rel="noreferrer">
                <strong>${esc(n.name)}</strong>
              </a>
            `).join("")}
          </div>
        </div>
      `).join("");
    }

    function renderSoftware(list) {
      const root = document.getElementById("soft-list");
      if (!list?.length) {
        root.innerHTML = '<p class="empty">暂无软件/账号。</p>';
        return;
      }
      root.innerHTML = list.map((s) => {
        const body = `
          <div class="left">
            <strong>${esc(s.name)}</strong>
            <div class="meta">${esc(s.account || "")} · ${esc(s.use || "")}</div>
          </div>
          <span class="kind">${esc(s.kind || "其他")}</span>`;
        return s.url
          ? `<a class="soft-item" href="${esc(s.url)}" target="_blank" rel="noreferrer">${body}</a>`
          : `<div class="soft-item">${body}</div>`;
      }).join("");
    }

    function daypart(now = new Date()) {
      const h = now.getHours();
      return h < 6 ? "深夜" : h < 12 ? "上午" : h < 18 ? "下午" : "夜晚";
    }

    function tick() {
      const now = new Date();
      document.getElementById("clock").textContent =
        String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    }

    // custom scrollbar for board only
    (function initScrollbar() {
      const root = document.getElementById("board");
      const rail = document.getElementById("sb-rail");
      const thumb = document.getElementById("sb-thumb");
      if (!root || !rail || !thumb) return;
      let hideTimer = 0, dragging = false, dragStartY = 0, dragStartScroll = 0;
      function metrics() {
        const view = root.clientHeight, doc = root.scrollHeight, track = rail.clientHeight;
        const thumbH = Math.max(40, Math.round(track * Math.min(1, view / Math.max(doc, 1))));
        const maxScroll = Math.max(0, doc - view);
        const maxTop = Math.max(0, track - thumbH);
        const top = maxScroll === 0 ? 0 : (root.scrollTop / maxScroll) * maxTop;
        return { thumbH, maxScroll, maxTop, top, view, doc };
      }
      function render() {
        const m = metrics();
        const needed = m.doc > m.view + 2;
        rail.classList.toggle("is-visible", needed || dragging);
        if (!needed) return;
        thumb.style.height = m.thumbH + "px";
        thumb.style.transform = "translateY(" + m.top + "px)";
      }
      function flash() {
        const m = metrics();
        if (m.doc <= m.view + 2 && !dragging) { rail.classList.remove("is-visible"); return; }
        rail.classList.add("is-visible");
        clearTimeout(hideTimer);
        if (!dragging) hideTimer = setTimeout(() => { if (!dragging) rail.classList.remove("is-visible"); }, 1000);
      }
      thumb.addEventListener("pointerdown", (e) => {
        dragging = true; thumb.classList.add("is-dragging");
        dragStartY = e.clientY; dragStartScroll = root.scrollTop;
        thumb.setPointerCapture(e.pointerId); flash(); e.preventDefault();
      });
      thumb.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const m = metrics();
        const dy = e.clientY - dragStartY;
        root.scrollTop = dragStartScroll + (m.maxTop ? (dy / m.maxTop) * m.maxScroll : 0);
      });
      const end = (e) => {
        if (!dragging) return; dragging = false; thumb.classList.remove("is-dragging");
        try { thumb.releasePointerCapture(e.pointerId); } catch (_) {}
        flash();
      };
      thumb.addEventListener("pointerup", end);
      thumb.addEventListener("pointercancel", end);
      rail.addEventListener("pointerdown", (e) => {
        if (e.target === thumb) return;
        const m = metrics();
        const rect = rail.getBoundingClientRect();
        const y = e.clientY - rect.top - m.thumbH / 2;
        const top = Math.min(m.maxTop, Math.max(0, y));
        root.scrollTop = m.maxTop ? (top / m.maxTop) * m.maxScroll : 0;
        flash();
      });
      root.addEventListener("scroll", () => { render(); flash(); }, { passive: true });
      window.addEventListener("resize", () => { render(); flash(); });
      render(); flash();
    })();

    (async function main() {
      tick();
      setInterval(tick, 15000);
      try {
        const cfg = await loadConfig();
        document.getElementById("hero-title").textContent = cfg.title || "云端工作台";
        document.getElementById("hero-sub").textContent = cfg.subtitle || "";
        const todos = mergeTodos(cfg.todos || []);
        renderTodos(todos);
        renderStatus(cfg.status || {}, daypart());
        renderTemplates(cfg.templates || []);
        renderNav(cfg.nav || []);
        renderSoftware(cfg.software || []);
      } catch (e) {
        document.getElementById("todo-list").innerHTML =
          '<p class="empty">配置加载失败，请检查 config/workbench.json</p>';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
