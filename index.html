<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wizard6 · book</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1000px 520px at 50% 30%, #1c2436 0%, transparent 55%),
        #090b10;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: #eceae6;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .stage {
      perspective: 1100px;
      perspective-origin: 50% 45%;
      width: min(92vw, 420px);
      height: 380px;
      display: grid;
      place-items: center;
    }

    .book {
      --rx: 8deg;
      --ry: -32deg;
      width: 200px;
      height: 300px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry));
      cursor: grab;
    }

    .book.is-dragging { cursor: grabbing; }

    .face {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    .cover-front {
      background:
        linear-gradient(145deg, rgba(255,255,255,0.12), transparent 42%),
        linear-gradient(180deg, #1f2937 0%, #111827 100%);
      border-radius: 2px 5px 5px 2px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08),
        inset 10px 0 18px rgba(0,0,0,0.25);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      text-align: center;
      transform: translateZ(14px);
    }

    .cover-front h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: 0.18em;
      font-weight: 600;
    }

    .cover-front p {
      margin: 0.85rem 0 0;
      font-size: 0.78rem;
      opacity: 0.65;
      letter-spacing: 0.12em;
      font-family: system-ui, sans-serif;
    }

    .cover-ornament {
      width: 42px;
      height: 2px;
      margin: 1rem auto 0;
      background: linear-gradient(90deg, transparent, #f87171, #60a5fa, transparent);
    }

    .cover-back {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-radius: 5px 2px 2px 5px;
      transform: rotateY(180deg) translateZ(14px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .pages {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 3px;
      right: 3px;
      background: repeating-linear-gradient(
        to right,
        #f8fafc 0 1px,
        #e2e8f0 1px 2px
      );
      transform: translateZ(0);
      box-shadow: inset 0 0 12px rgba(0,0,0,0.08);
    }

    .spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 28px;
      transform-origin: center center;
      transform: rotateY(-90deg) translateZ(14px);
      overflow: hidden;
      border-radius: 3px;
      background: #0a0a0a;
      box-shadow:
        inset -4px 0 10px rgba(0,0,0,0.4),
        inset 3px 0 6px rgba(255,255,255,0.1);
    }

    .spine::before {
      content: "";
      position: absolute;
      left: -50%;
      top: -70%;
      width: 200%;
      height: 240%;
      background: repeating-linear-gradient(
        -32deg,
        #e11d48 0 16px,
        #f8fafc 16px 30px,
        #2563eb 30px 46px,
        #f8fafc 46px 60px
      );
      animation: pole 7.5s linear infinite;
    }

    @keyframes pole {
      to { transform: translateY(60px); }
    }

    .spine-label {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      writing-mode: vertical-rl;
      letter-spacing: 0.28em;
      font-size: 0.72rem;
      font-weight: 700;
      color: #0b0d12;
      text-shadow: 0 1px 0 rgba(255,255,255,0.35);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .fore-edge {
      position: absolute;
      top: 5px;
      bottom: 5px;
      right: 0;
      width: 28px;
      transform-origin: center center;
      transform: rotateY(90deg) translateZ(14px);
      background: repeating-linear-gradient(
        to bottom,
        #f1f5f9 0 2px,
        #cbd5e1 2px 3px
      );
      box-shadow: inset 0 0 8px rgba(0,0,0,0.15);
    }

    .top-edge, .bottom-edge {
      position: absolute;
      left: 0;
      right: 0;
      height: 28px;
      background: linear-gradient(90deg, #e2e8f0, #f8fafc 30%, #cbd5e1);
    }
    .top-edge {
      top: 0;
      transform: rotateX(90deg) translateZ(14px);
    }
    .bottom-edge {
      bottom: 0;
      transform: rotateX(-90deg) translateZ(14px);
    }

    .caption {
      margin-top: 0.5rem;
      text-align: center;
      font-size: 0.82rem;
      opacity: 0.5;
      letter-spacing: 0.04em;
      font-family: system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div>
    <div class="stage">
      <div class="book" id="book" aria-label="可旋转的三维书">
        <div class="pages" aria-hidden="true"></div>
        <div class="top-edge" aria-hidden="true"></div>
        <div class="bottom-edge" aria-hidden="true"></div>
        <div class="face cover-front">
          <div>
            <h1>WIZARD</h1>
            <div class="cover-ornament" aria-hidden="true"></div>
            <p>A SMALL VOLUME</p>
          </div>
        </div>
        <div class="face cover-back" aria-hidden="true"></div>
        <div class="spine"><span class="spine-label">WIZARD</span></div>
        <div class="fore-edge" aria-hidden="true"></div>
      </div>
    </div>
    <p class="caption">拖拽旋转 · 可转满 360°</p>
  </div>

  <script>
    const book = document.getElementById("book");
    let ry = -32;
    let rx = 8;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;

    function apply() {
      // soft clamp vertical tilt so it doesn't go fully upside-down too easily
      // but allow full 360 on Y
      rx = ((rx + 180) % 360 + 360) % 360 - 180;
      if (rx > 70) rx = 70;
      if (rx < -70) rx = -70;
      book.style.setProperty("--ry", ry + "deg");
      book.style.setProperty("--rx", rx + "deg");
    }

    function onDown(e) {
      dragging = true;
      book.classList.add("is-dragging");
      lastX = e.clientX;
      lastY = e.clientY;
      book.setPointerCapture?.(e.pointerId);
    }

    function onMove(e) {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      ry += dx * 0.45;
      rx -= dy * 0.35;
      apply();
    }

    function onUp(e) {
      dragging = false;
      book.classList.remove("is-dragging");
      try { book.releasePointerCapture?.(e.pointerId); } catch (_) {}
    }

    book.addEventListener("pointerdown", onDown);
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);

    apply();
  </script>
</body>
</html>
