<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wizard6 · bookshelf</title>
  <style>
    /* Shelf inspired by petargyurov/virtual-bookshelf; flip by Nodlik/StPageFlip */
    :root {
      --bg0: #12151c;
      --bg1: #1b2230;
      --wood1: #6b4426;
      --wood2: #3d2414;
      --paper: #f7f1e8;
      --ink: #1c1917;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Iowan Old Style", Palatino, Georgia, "Songti SC", serif;
      color: #e7e5e4;
      background:
        radial-gradient(1000px 520px at 50% -10%, #2a3550 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
    }
    header {
      padding: 2rem 1rem 0.5rem;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      letter-spacing: 0.35em;
      font-weight: 560;
    }
    header p {
      margin: 0.6rem 0 0;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      color: #a8a29e;
    }
    header a {
      color: #93c5fd;
      text-decoration: none;
    }

    .room {
      width: min(980px, 94vw);
      margin: 1.5rem auto 3rem;
    }

    .shelf-unit {
      position: relative;
      padding: 2.4rem 1.6rem 0;
      background: linear-gradient(180deg, #4e3426 0%, #2b1a10 100%);
      border-radius: 10px 10px 0 0;
      box-shadow:
        inset 0 18px 40px rgba(0,0,0,0.35),
        0 30px 60px rgba(0,0,0,0.45);
    }
    .shelf-plank {
      height: 18px;
      margin: 0 -0.4rem;
      background: linear-gradient(180deg, #8b5e3c, #5a3a24 55%, #3b2416);
      border-radius: 0 0 6px 6px;
      box-shadow: 0 10px 18px rgba(0,0,0,0.4);
    }

    .bookshelf {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      flex-wrap: nowrap;
      gap: 6px;
      min-height: 300px;
      padding: 0 0.5rem 0.4rem;
      perspective: 900px;
    }

    .book {
      --bw: 46px;
      --bh: 270px;
      --bd: 170px;
      width: var(--bw);
      height: var(--bh);
      position: relative;
      margin: 0 2px;
      transform-style: preserve-3d;
      transform-origin: bottom left;
      transform: translateZ(0) rotateY(0);
      transition: transform 0.7s cubic-bezier(.2,.8,.2,1);
      cursor: pointer;
      flex: 0 0 auto;
    }
    .book:hover,
    .book:focus-visible {
      z-index: 5;
      outline: none;
      transform: rotateX(-22deg) rotateY(-38deg) rotateZ(-12deg) translateY(36px) translateX(-18px);
    }

    .side {
      position: absolute;
      border-radius: 2px;
      transform-origin: center left;
    }

    .spine {
      width: var(--bw);
      height: var(--bh);
      left: 0; top: 0;
      overflow: hidden;
      transform: rotateY(0) translateZ(0);
      box-shadow:
        inset -4px 0 10px rgba(0,0,0,0.35),
        inset 2px 0 5px rgba(255,255,255,0.18),
        0 0 0 1px rgba(0,0,0,0.25);
    }
    .spine::before {
      content: "";
      position: absolute;
      inset: -80% -70%;
      background: var(--pole);
      animation: pole 8s linear infinite;
    }
    @keyframes pole { to { transform: translateY(54px); } }

    .spine-title {
      position: absolute;
      inset: 10px 0 36px;
      display: grid;
      place-items: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 0.22em;
      font-size: 0.72rem;
      font-weight: 700;
      color: #0f172a;
      text-shadow: 0 1px 0 rgba(255,255,255,0.35);
      mix-blend-mode: multiply;
      z-index: 1;
    }
    .spine-author {
      position: absolute;
      bottom: 8px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.58rem;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      color: rgba(15,23,42,0.75);
      z-index: 1;
      mix-blend-mode: multiply;
    }

    .top {
      width: var(--bw);
      height: var(--bd);
      top: 0;
      background: repeating-linear-gradient(
        90deg,
        #f8fafc 0 3px,
        #d6d3d1 3px 4px
      );
      transform: rotateX(90deg) translateZ(calc(var(--bd) / 2)) translateY(calc(var(--bd) / -2));
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
    }

    .cover {
      width: var(--bd);
      height: var(--bh);
      left: var(--bw);
      top: 0;
      background: var(--cover);
      transform: rotateY(90deg) translateZ(0);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,0.08),
        inset 12px 0 24px rgba(0,0,0,0.06);
      display: grid;
      place-items: center;
      padding: 1rem;
      text-align: center;
      color: var(--ink);
    }
    .cover strong {
      font-size: 1.05rem;
      letter-spacing: 0.12em;
    }
    .cover span {
      display: block;
      margin-top: 0.7rem;
      font-size: 0.68rem;
      opacity: 0.55;
      font-family: system-ui, sans-serif;
      letter-spacing: 0.08em;
    }

    /* ===== Reader / StPageFlip ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(8,10,16,0.78);
      backdrop-filter: blur(8px);
      display: none;
      z-index: 40;
      padding: 1rem;
    }
    .overlay.open { display: grid; place-items: center; }

    .reader {
      width: min(920px, 96vw);
      display: grid;
      gap: 0.9rem;
      justify-items: center;
    }
    .reader-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      color: #e7e5e4;
      font-family: system-ui, sans-serif;
    }
    .reader-bar h2 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      font-weight: 560;
    }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font: 600 0.85rem system-ui, sans-serif;
      cursor: pointer;
      background: #f5f5f4;
      color: #1c1917;
    }
    .btn.ghost {
      background: transparent;
      color: #e7e5e4;
      border: 1px solid rgba(231,229,228,0.35);
    }
    .btn:disabled { opacity: 0.4; cursor: default; }

    #bookRoot {
      margin: 0 auto;
      box-shadow: 0 28px 60px rgba(0,0,0,0.5);
    }
    .page {
      background: var(--paper);
      color: var(--ink);
      border: 1px solid #e7e0d4;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 1.6rem 1.7rem;
      font-size: 0.98rem;
      line-height: 1.7;
    }
    .page.hard {
      background: var(--hard-bg, #fff7ed);
    }
    .page h3 {
      margin: 0 0 0.8rem;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }
    .page p { margin: 0 0 0.75rem; }
    .page .footer-num {
      margin-top: auto;
      font-size: 0.75rem;
      opacity: 0.45;
      font-family: system-ui, sans-serif;
      text-align: right;
    }
    .cover-page {
      display: grid;
      place-items: center;
      text-align: center;
      background: var(--hard-bg, #fff7ed) !important;
    }
    .cover-page .big {
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: 0.18em;
      margin: 0;
    }
    .cover-page .sub {
      margin-top: 1rem;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      opacity: 0.6;
      letter-spacing: 0.08em;
    }
    .pole-strip {
      width: 56px;
      height: 8px;
      margin: 1.2rem auto 0;
      border-radius: 999px;
      background: var(--pole-mini);
    }

    .credits {
      text-align: center;
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;
      color: #78716c;
      padding-bottom: 2rem;
    }
    .credits a { color: #93c5fd; }
  </style>
</head>
<body>
  <header>
    <h1>WIZARD SHELF</h1>
    <p>点击书脊打开 · 拖拽或点角翻页</p>
  </header>

  <div class="room">
    <div class="shelf-unit">
      <div class="bookshelf" id="shelf" aria-label="书架"></div>
      <div class="shelf-plank" aria-hidden="true"></div>
    </div>
  </div>

  <p class="credits">
    书架结构参考
    <a href="https://github.com/petargyurov/virtual-bookshelf" target="_blank" rel="noreferrer">virtual-bookshelf</a>
    · 翻页使用
    <a href="https://github.com/Nodlik/StPageFlip" target="_blank" rel="noreferrer">StPageFlip</a>
  </p>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="reader">
      <div class="reader-bar">
        <h2 id="readerTitle">书名</h2>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
          <button class="btn ghost" id="prevBtn" type="button">上一页</button>
          <button class="btn ghost" id="nextBtn" type="button">下一页</button>
          <button class="btn" id="closeBtn" type="button">关闭</button>
        </div>
      </div>
      <div id="bookRoot"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
  <script>
    const BOOKS = [
      {
        title: "晨雾",
        author: "WZ",
        pole: "repeating-linear-gradient(-32deg,#e11d48 0 14px,#fff 14px 26px,#2563eb 26px 40px,#fff 40px 52px)",
        poleMini: "linear-gradient(90deg,#e11d48,#fff,#2563eb,#fff,#e11d48)",
        cover: "linear-gradient(165deg,#fffaf5,#ffe8d6 55%,#ffd7b8)",
        hard: "#fff7ed",
        h: 278, w: 44,
        pages: [
          ["山脊", "山脊还没醒透，雾先把山谷填满。脚步踩在湿草上，像踩在一层薄云上。"],
          ["石阶", "石阶被露水洗亮。远处有人挑着竹筐，轮廓在雾里一晃一晃。"],
          ["茶摊", "摊主用粗瓷碗倒茶，热气一冲，雾里忽然开出一小块晴空。"],
          ["回声", "你喊一声，山谷迟疑片刻才答。像它也在想，该不该把秘密交出来。"],
        ],
      },
      {
        title: "星图",
        author: "WZ",
        pole: "repeating-linear-gradient(-28deg,#7c3aed 0 14px,#fef3c7 14px 26px,#06b6d4 26px 40px,#fef3c7 40px 52px)",
        poleMini: "linear-gradient(90deg,#7c3aed,#fef3c7,#06b6d4,#fef3c7)",
        cover: "linear-gradient(165deg,#f8fbff,#e8f4ff 50%,#d9ecff)",
        hard: "#eff6ff",
        h: 262, w: 48,
        pages: [
          ["命名", "夜里把灯关掉，天花板变成深海。你开始给每一颗亮点命名。"],
          ["航线", "有人说星座是古人的导航。你更愿意把它当成一封写得很慢的信。"],
          ["流星", "一道白痕划过，短得像叹息。你还是许了愿，怕错过这次巧合。"],
          ["黎明", "天边先灰后蓝。星图收起，世界又变回可触碰的尺寸。"],
        ],
      },
      {
        title: "潮声",
        author: "WZ",
        pole: "repeating-linear-gradient(-30deg,#0d9488 0 14px,#fff 14px 26px,#f97316 26px 40px,#fff 40px 52px)",
        poleMini: "linear-gradient(90deg,#0d9488,#fff,#f97316,#fff)",
        cover: "linear-gradient(165deg,#f3fcfd,#d9f7f8 48%,#bfeff2)",
        hard: "#ecfeff",
        h: 286, w: 42,
        pages: [
          ["节奏", "海不是安静的。它用同一种节奏说不同的话，听久了会听见自己的呼吸。"],
          ["贝壳", "你捡起一枚，贴到耳边——其实听到的是血流通过的声音，偏要说是海。"],
          ["渔火", "远处几点橙光随波起伏，像有人在夜里缝补被撕开的水平线。"],
          ["退潮", "沙滩露出脚印和碎玻璃。世界暂时坦白，等下一潮再把秘密盖上。"],
        ],
      },
      {
        title: "窑火",
        author: "WZ",
        pole: "repeating-linear-gradient(-34deg,#dc2626 0 14px,#fef9c3 14px 26px,#1d4ed8 26px 40px,#fef9c3 40px 52px)",
        poleMini: "linear-gradient(90deg,#dc2626,#fef9c3,#1d4ed8,#fef9c3)",
        cover: "linear-gradient(165deg,#fffdf5,#ffefb8 45%,#ffe08a)",
        hard: "#fffbeb",
        h: 254, w: 50,
        pages: [
          ["入窑", "泥还软着，就被推进高温。成形往往发生在你看不见的地方。"],
          ["开窑", "盖子揭开，热浪扑面。有的开裂，有的成釉——结果从不预告。"],
          ["杯沿", "指尖摸到一圈细润。你忽然明白：耐心也会留下触感。"],
          ["茶烟", "热水入杯，烟丝上升。窑火的故事被喝成一口温热的安静。"],
        ],
      },
      {
        title: "竹简",
        author: "WZ",
        pole: "repeating-linear-gradient(-26deg,#16a34a 0 14px,#fefce8 14px 26px,#ca8a04 26px 40px,#fefce8 40px 52px)",
        poleMini: "linear-gradient(90deg,#16a34a,#fefce8,#ca8a04,#fefce8)",
        cover: "linear-gradient(165deg,#f7fee7,#e9f8c8 52%,#d4ef9a)",
        hard: "#f7fee7",
        h: 272, w: 46,
        pages: [
          ["刻痕", "字被刻进纤维里，比纸更扛得住时间，也更沉。"],
          ["绳结", "一册册用麻绳串起。解开时，灰尘像很小的史官，先出来报到。"],
          ["缺页", "中间断了一片。你用想象补全，反而读出比原文更活的意思。"],
          ["传抄", "后人一笔一画誊写。错误也会繁殖，美也会——这就是流传。"],
        ],
      },
      {
        title: "夜航",
        author: "WZ",
        pole: "repeating-linear-gradient(-31deg,#db2777 0 14px,#fafafa 14px 26px,#4f46e5 26px 40px,#fafafa 40px 52px)",
        poleMini: "linear-gradient(90deg,#db2777,#fafafa,#4f46e5,#fafafa)",
        cover: "linear-gradient(165deg,#fff5fa,#ffe0ef 48%,#ffc8e3)",
        hard: "#fdf2f8",
        h: 268, w: 45,
        pages: [
          ["熄灯", "车厢灯一盏盏灭掉，只剩窗外流动的暗。城市变成一串疏星。"],
          ["站名", "广播报站，声音发黏。你听不清，却知道离目的地又近了一点。"],
          ["窗霜", "玻璃起雾，你用指尖画一条短线。线外是速度，线内是你。"],
          ["到站", "门开，冷空气涌入。夜航结束，故事改在地面继续。"],
        ],
      },
    ];

    const shelf = document.getElementById("shelf");
    const overlay = document.getElementById("overlay");
    const bookRoot = document.getElementById("bookRoot");
    const readerTitle = document.getElementById("readerTitle");
    let pageFlip = null;

    BOOKS.forEach((b, i) => {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "book";
      el.style.setProperty("--bw", b.w + "px");
      el.style.setProperty("--bh", b.h + "px");
      el.style.setProperty("--pole", b.pole);
      el.style.setProperty("--cover", b.cover);
      el.setAttribute("aria-label", "打开《" + b.title + "》");
      el.innerHTML = `
        <div class="side spine">
          <span class="spine-title">${b.title}</span>
          <span class="spine-author">${b.author}</span>
        </div>
        <div class="side top" aria-hidden="true"></div>
        <div class="side cover">
          <div>
            <strong>${b.title}</strong>
            <span>LIGHT COVER</span>
          </div>
        </div>
      `;
      el.addEventListener("click", () => openBook(i));
      shelf.appendChild(el);
    });

    function buildPages(book) {
      const html = [];
      html.push(`
        <div class="page hard cover-page" data-density="hard" style="--hard-bg:${book.hard};--pole-mini:${book.poleMini}">
          <div>
            <h3 class="big">${book.title}</h3>
            <div class="pole-strip"></div>
            <p class="sub">浅色封面 · 彩色书脊</p>
          </div>
        </div>
      `);
      book.pages.forEach((pair, idx) => {
        html.push(`
          <div class="page">
            <h3>${pair[0]}</h3>
            <p>${pair[1]}</p>
            <div class="footer-num">${idx + 1}</div>
          </div>
        `);
      });
      // pad to even count for nicer spreads (cover + pages)
      const total = 1 + book.pages.length;
      if (total % 2 === 1) {
        html.push(`<div class="page"><h3></h3><p></p></div>`);
      }
      html.push(`
        <div class="page hard cover-page" data-density="hard" style="--hard-bg:${book.hard}">
          <div>
            <h3 class="big">${book.title}</h3>
            <p class="sub">— end —</p>
          </div>
        </div>
      `);
      return html.join("");
    }

    function openBook(index) {
      const book = BOOKS[index];
      readerTitle.textContent = book.title;
      if (pageFlip) {
        try { pageFlip.destroy(); } catch (_) {}
        pageFlip = null;
      }
      bookRoot.innerHTML = "";
      const host = document.createElement("div");
      host.className = "flipbook-host";
      host.innerHTML = buildPages(book);
      bookRoot.appendChild(host);

      const width = Math.min(420, Math.floor(window.innerWidth * 0.42));
      const height = Math.min(560, Math.floor(window.innerHeight * 0.72));

      pageFlip = new St.PageFlip(host, {
        width,
        height,
        size: "stretch",
        minWidth: 280,
        maxWidth: 520,
        minHeight: 380,
        maxHeight: 680,
        drawShadow: true,
        flippingTime: 850,
        usePortrait: true,
        startZIndex: 5,
        autoSize: true,
        maxShadowOpacity: 0.45,
        showCover: true,
        mobileScrollSupport: true,
        clickEventForward: true,
        useMouseEvents: true,
        swipeDistance: 30,
        showPageCorners: true,
        disableFlipByClick: false,
      });
      pageFlip.loadFromHTML(host.querySelectorAll(".page"));

      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.getElementById("prevBtn").onclick = () => pageFlip.flipPrev();
      document.getElementById("nextBtn").onclick = () => pageFlip.flipNext();
    }

    function closeReader() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      if (pageFlip) {
        try { pageFlip.destroy(); } catch (_) {}
        pageFlip = null;
      }
      bookRoot.innerHTML = "";
    }

    document.getElementById("closeBtn").addEventListener("click", closeReader);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeReader();
    });
    window.addEventListener("keydown", (e) => {
      if (!overlay.classList.contains("open")) return;
      if (e.key === "Escape") closeReader();
      if (e.key === "ArrowRight") pageFlip?.flipNext();
      if (e.key === "ArrowLeft") pageFlip?.flipPrev();
    });
  </script>
</body>
</html>
