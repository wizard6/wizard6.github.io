<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" class="nebula-active">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="wizard6 · 个人站点" />
  <title>wizard6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@500;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />
  <style>
    :root {
      --radius: 16px;
      --font-serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
      --font-sans: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-epitaph: "Great Vibes", "Zhi Mang Xing", "Noto Serif SC", cursive;
      --bg: #080a0f;
      --bg-elevated: #0f131c;
      --card: #141a26;
      --text: #eef2ff;
      --text-soft: #c8d2e8;
      --muted: #7b8ba8;
      --accent: #6d8bff;
      --accent-2: #a78bfa;
      --accent-glow: rgba(109, 139, 255, 0.18);
      --line: #243044;
      --header-bg: rgba(8, 10, 15, 0.52);
      --hero-bg: linear-gradient(135deg, rgba(109, 139, 255, 0.08), rgba(167, 139, 250, 0.05));
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background: var(--bg);
      overflow-x: hidden;
    }

    .nebula {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(900px 520px at 12% 8%, rgba(109, 139, 255, 0.22), transparent 55%),
        radial-gradient(700px 480px at 88% 18%, rgba(167, 139, 250, 0.18), transparent 50%),
        radial-gradient(600px 420px at 50% 100%, rgba(56, 189, 248, 0.08), transparent 55%),
        var(--bg);
    }
    .nebula::before,
    .nebula::after {
      content: "";
      position: absolute;
      inset: -20%;
      background-image:
        radial-gradient(1.5px 1.5px at 10% 20%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,0.45), transparent),
        radial-gradient(1.5px 1.5px at 55% 35%, rgba(200,210,255,0.8), transparent),
        radial-gradient(1px 1px at 75% 55%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1.5px 1.5px at 90% 25%, rgba(180,190,255,0.65), transparent),
        radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 45% 10%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1.5px 1.5px at 65% 80%, rgba(200,220,255,0.55), transparent);
      animation: drift 48s linear infinite;
      opacity: 0.85;
    }
    .nebula::after {
      animation-duration: 72s;
      animation-direction: reverse;
      opacity: 0.5;
      filter: blur(0.2px);
    }
    @keyframes drift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-4%, 3%, 0); }
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      background: var(--header-bg);
      border-bottom: 1px solid var(--line);
    }
    .site-header::after {
      content: "";
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,178,250,0.35), transparent);
      box-shadow: 0 0 16px rgba(167,139,250,0.25);
    }
    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .brand {
      color: var(--text);
      text-decoration: none;
      font-family: var(--font-serif);
      font-weight: 700;
      letter-spacing: 0.08em;
      font-size: 1.05rem;
    }
    .brand:hover { color: #fff; }
    .nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
      padding: 8px 12px;
      border-radius: 999px;
      transition: color 0.2s, background 0.2s;
    }
    .nav a:hover,
    .nav a.is-active {
      color: var(--text);
      background: rgba(109, 139, 255, 0.12);
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 48px 20px 64px;
    }

    .hero {
      position: relative;
      width: min(720px, 100%);
      padding: 44px 36px 36px;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid var(--line);
      background: var(--hero-bg), rgba(20, 26, 38, 0.72);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .hero::before {
      content: "";
      position: absolute;
      top: -40%;
      right: -10%;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, var(--accent-glow), transparent 70%);
      pointer-events: none;
    }
    .hero-body {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .hero-eyebrow {
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 12px;
    }
    .hero h1 {
      font-family: var(--font-serif);
      margin: 0 0 14px;
      font-size: clamp(2rem, 5vw, 2.8rem);
      line-height: 1.2;
      font-weight: 700;
      background: linear-gradient(120deg, #fff, #c8d2e8 45%, #b8c8ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(109, 139, 255, 0.15);
    }
    .hero-desc {
      margin: 0 0 22px;
      max-width: 18em;
      font-size: clamp(1.45rem, 3.4vw, 2rem);
      font-family: var(--font-epitaph);
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1.45;
      color: var(--text-soft);
    }
    .hero-desc .ch {
      display: inline-block;
      transition: color 0.15s linear, transform 0.15s ease;
    }
    .hero-desc:hover .ch {
      animation: shimmer 1.2s ease both;
    }
    @keyframes shimmer {
      0%, 100% { color: var(--text-soft); }
      35% { color: #c4b5fd; }
      70% { color: #93c5fd; }
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      width: min(100%, 42rem);
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(109, 139, 255, 0.28);
      background: rgba(109, 139, 255, 0.14);
      color: #dbe4ff;
      border-radius: 999px;
      padding: 0.7rem 1.2rem;
      font: 600 0.9rem var(--font-sans);
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      background: rgba(109, 139, 255, 0.24);
      border-color: rgba(140, 168, 255, 0.5);
      box-shadow: 0 0 24px rgba(109, 139, 255, 0.22);
      transform: translateY(-1px);
    }
    .btn.ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--text-soft);
    }
    .btn.ghost:hover {
      border-color: rgba(167, 139, 250, 0.45);
      color: var(--text);
      background: rgba(167, 139, 250, 0.08);
    }

    .site-footer {
      border-top: 1px solid var(--line);
      background: rgba(8, 10, 15, 0.4);
      backdrop-filter: blur(10px);
    }
    .footer-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .footer-inner a { color: var(--accent); text-decoration: none; }
    .footer-inner a:hover { color: #9cb4ff; }

    .cursor-glow {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle, rgba(109,139,255,0.14), transparent 70%);
      transform: translate(-50%, -50%);
      transition: opacity 0.25s ease;
      opacity: 0;
    }
    @media (pointer: fine) {
      body.has-pointer .cursor-glow { opacity: 1; }
    }
    @media (max-width: 640px) {
      .hero { padding: 32px 22px 28px; }
      .nav { display: none; }
    }
  </style>
</head>
<body>
  <div class="nebula" aria-hidden="true"></div>
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <div class="app">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./">wizard6</a>
        <nav class="nav" aria-label="主导航">
          <a class="is-active" href="./">首页</a>
          <a href="https://github.com/wizard6" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" aria-label="欢迎">
        <div class="hero-body">
          <div class="hero-eyebrow">Personal Site</div>
          <h1>wizard6</h1>
          <p class="hero-desc" id="hero-desc">记录想法与创作</p>
          <div class="hero-actions">
            <a class="btn" href="https://github.com/wizard6" target="_blank" rel="noreferrer">访问 GitHub</a>
            <a class="btn ghost" href="https://github.com/wizard6/wizard6.github.io" target="_blank" rel="noreferrer">本站仓库</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>wizard6 · welcome</span>
        <a href="https://github.com/wizard6/wizard6.github.io">Source</a>
      </div>
    </footer>
  </div>

  <script>
    // rainbow-ish calligraphy chars (inspired by reference site hero-desc)
    const desc = document.getElementById("hero-desc");
    const raw = desc.textContent.trim();
    const palette = ["#c8d2e8", "#b8c8ff", "#c4b5fd", "#93c5fd", "#e9d5ff", "#a5b4fc"];
    desc.innerHTML = [...raw].map((ch, i) => {
      if (ch === " ") return " ";
      const color = palette[i % palette.length];
      return `<span class="ch" style="color:${color}">${ch}</span>`;
    }).join("");

    const glow = document.getElementById("cursor-glow");
    if (window.matchMedia("(pointer: fine)").matches) {
      document.body.classList.add("has-pointer");
      window.addEventListener("pointermove", (e) => {
        glow.style.left = e.clientX + "px";
        glow.style.top = e.clientY + "px";
      }, { passive: true });
    }
  </script>
</body>
</html>
