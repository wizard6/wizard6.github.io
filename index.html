<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="wizard6 · 云端工作台" />
  <title>云端工作台 · wizard6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Noto+Serif+SC:wght@500;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/workbench.css" />
</head>
<body>
  <div class="nebula" aria-hidden="true"></div>
  <div id="sticker-layer" aria-hidden="true"></div>

  <aside class="dock" id="dock" aria-label="快捷方式"></aside>

  <div class="desktop">
    <header class="topbar">
      <a class="brand" href="./">wizard6<span>CLOUD WORKBENCH</span></a>
      <div class="topbar-meta">
        <span class="pill"><i class="dot" aria-hidden="true"></i> <span class="pill-label">云端在线</span></span>
        <span id="clock">--:--</span>
      </div>
    </header>

    <div id="window-layer"></div>

    <p class="desktop-hint">从左侧快捷方式打开窗口</p>
  </div>

  <!-- Stub for future Win+R quick run (hidden). Alt+R opens run placeholder via JS. -->
  <div id="run-dialog" hidden aria-hidden="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
